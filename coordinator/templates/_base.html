<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}VPN Prober{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% block head_extra %}{% endblock %}
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --panel-2: #21252e;
      --border: #2a2f3a;
      --muted: #7b8190;
      --fg: #e6e9ef;
      --accent: #3b82f6;
      --accent-2: #6366f1;
      --ok: #16a34a;
      --warn: #d97706;
      --fail: #dc2626;
      --pending: #6b7280;
      --claimed: #2563eb;
      --done: #16a34a;
      --cancelled: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }
    pre {
      background: #0a0c10;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .brand {
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--fg);
    }
    header .brand .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    nav a {
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      margin-right: 4px;
    }
    nav a.active { color: var(--fg); background: var(--panel-2); }
    nav a:hover { color: var(--fg); text-decoration: none; }
    header .spacer { flex: 1; }
    header .logout { color: var(--muted); font-size: 12px; }

    main { max-width: 1400px; margin: 0 auto; padding: 24px; }

    h1, h2, h3 { margin: 0 0 16px; font-weight: 600; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; }
    h3 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 260px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .card-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-title h2 { margin: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .kpi { display: flex; gap: 24px; flex-wrap: wrap; }
    .kpi .item { min-width: 130px; }
    .kpi .item .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
    .kpi .item .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: var(--panel-2); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.pending { background: rgba(107,114,128,0.2); color: #d1d5db; }
    .badge.claimed { background: rgba(37,99,235,0.2); color: #93c5fd; }
    .badge.done { background: rgba(22,163,74,0.2); color: #86efac; }
    .badge.failed { background: rgba(220,38,38,0.2); color: #fca5a5; }
    .badge.cancelled { background: rgba(217,119,6,0.2); color: #fcd34d; }
    .badge.ok { background: rgba(22,163,74,0.2); color: #86efac; }
    .badge.fail { background: rgba(220,38,38,0.2); color: #fca5a5; }

    .progress {
      width: 100%;
      background: #0a0c10;
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }
    .progress .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.4s ease;
    }
    .progress.ok .bar { background: var(--done); }
    .progress.warn .bar { background: var(--warn); }

    .btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--fg);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }
    .btn:hover { background: #2c313b; text-decoration: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { background: #2563eb; }
    .btn.danger { background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.4); color: #fca5a5; }
    .btn.danger:hover { background: rgba(220,38,38,0.25); }
    .btn.ghost { background: transparent; }

    input[type=text], input[type=password], textarea {
      width: 100%;
      background: #0a0c10;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    input[type=text]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }

    .toast {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .toast.success { background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.3); color: #86efac; }
    .toast.error { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; }
    .toast.info { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      background: #0a0c10;
    }
    .dropzone:hover, .dropzone.over {
      border-color: var(--accent);
      color: var(--fg);
      background: rgba(59,130,246,0.05);
    }
    .dropzone .filename { color: var(--fg); font-weight: 500; }

    .copy-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .copy-row input[type=text] { font-family: ui-monospace, monospace; font-size: 12px; }
    .copy-row .btn { white-space: nowrap; }

    details summary { cursor: pointer; color: var(--muted); padding: 8px 0; }
    details[open] summary { color: var(--fg); }

    .pill {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      margin-left: 6px;
    }

    @media (max-width: 720px) {
      header { padding: 10px 12px; flex-wrap: wrap; }
      main { padding: 12px; }
      .kpi .item { min-width: 100px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> VPN Prober</div>
    {% if show_nav | default(true) %}
    <nav>
      <a href="/dashboard"        class="{% if active_page=='dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/dashboard/jobs"   class="{% if active_page=='jobs' %}active{% endif %}">Jobs</a>
      <a href="/dashboard/new"    class="{% if active_page=='new' %}active{% endif %}">New job</a>
      <a href="/dashboard/nodes"  class="{% if active_page=='nodes' %}active{% endif %}">Nodes</a>
    </nav>
    <div class="spacer"></div>
    <a class="logout" href="/dashboard/logout">log out</a>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        if (btn) {
          const old = btn.textContent;
          btn.textContent = "copied!";
          setTimeout(() => { btn.textContent = old; }, 1200);
        }
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
